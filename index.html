<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinoza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1c6a5e">
<meta name="apple-mobile-web-app-title" content="Kinoza">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"><path d="M4 12h3l2-5 4 10 2-5h5"/></svg></div>
      <div><div class="brand-name">Kinoza</div><div class="brand-sub">Programmes d'exercices</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <span class="badge-sample">Prototype</span>
      <span>Dossiers chiffrés dans ce navigateur. Exportez une sauvegarde chaque semaine.</span>
      <button class="btn sm" id="lock-now" type="button" style="margin-top:6px">Verrouiller</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div class="sheet" id="sheet" hidden></div>
<div class="preview" id="preview" hidden></div>
<div class="lock" id="lock" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/exercices.js"></script>
<script src="js/illustrations.js"></script>
<script src="js/pdf.js"></script>
<script src="js/securite.js"></script>
<script src="js/app.js"></script>
<script src="js/pageclient.js"></script>
<script src="js/conformite.js"></script>
</body>
</html>
